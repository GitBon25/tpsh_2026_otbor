version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: videos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d videos"]
      interval: 3s
      timeout: 3s
      retries: 30

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro